services:
  - type: web
    name: seo-audit-tool
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seo_tool.py"
    envVars:
      - key: SEO_USER
        sync: false
      - key: SEO_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
